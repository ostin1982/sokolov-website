<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <style>
    .glitch-top,
    .glitch-bottom {
      transform-box: fill-box;
      transform-origin: center;
    }

    .glitch-top {
      filter: sepia(1) saturate(12) hue-rotate(78deg) brightness(1.15);
      mix-blend-mode: screen;
      animation: glitch-top 620ms steps(2, end) infinite;
    }

    .glitch-bottom {
      filter: sepia(1) saturate(15) hue-rotate(82deg) contrast(1.5);
      mix-blend-mode: color-dodge;
      animation: glitch-bottom 470ms steps(2, end) infinite reverse;
    }

    @keyframes glitch-top {
      0% {
        clip-path: inset(18% 0 54% 0);
        transform: translate(-7px, 1px);
      }

      25% {
        clip-path: inset(42% 0 36% 0);
        transform: translate(6px, -1px);
      }

      50% {
        clip-path: inset(63% 0 17% 0);
        transform: translate(-5px, 2px);
      }

      75% {
        clip-path: inset(28% 0 58% 0);
        transform: translate(7px, 0);
      }

      100% {
        clip-path: inset(18% 0 54% 0);
        transform: translate(-7px, 1px);
      }
    }

    @keyframes glitch-bottom {
      0% {
        clip-path: inset(57% 0 20% 0);
        transform: translate(6px, -2px);
      }

      25% {
        clip-path: inset(21% 0 61% 0);
        transform: translate(-7px, 1px);
      }

      50% {
        clip-path: inset(44% 0 38% 0);
        transform: translate(5px, 2px);
      }

      75% {
        clip-path: inset(68% 0 12% 0);
        transform: translate(-6px, -1px);
      }

      100% {
        clip-path: inset(57% 0 20% 0);
        transform: translate(6px, -2px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glitch-top,
      .glitch-bottom {
        animation: none;
        opacity: 0;
      }
    }
  </style>
  <image href="data:image/png;base64," width="256" height="256" />
  <image
    class="glitch-top"
    href="data:image/png;base64,"
    width="256"
    height="256"
  />
  <image
    class="glitch-bottom"
    href="data:image/png;base64,"
    width="256"
    height="256"
  />
</svg>
